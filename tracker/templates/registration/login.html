{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
  <h1 class="text-2xl font-bold mb-4">Вход</h1>
  <form method="post" class="bg-white p-6 rounded shadow-sm max-w-sm space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-white text-indigo-600 border-2 border-indigo-600 px-5 py-2 rounded-lg hover:bg-indigo-50 font-medium">Войти</button>
  </form>
{% endblock %}
