{% extends 'base.html' %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold mb-4">Редактирование профиля</h1>

  <form method="post" class="bg-white p-6 rounded shadow-sm max-w-lg">
    {% csrf_token %}

    <div class="flex items-center gap-4 mb-3">
      <label for="{{ form.goal.id_for_label }}" class="w-40 text-sm text-gray-700">Цель</label>
      {{ form.goal }}
    </div>
    <div class="flex items-center gap-4 mb-3">
      <label for="{{ form.gender.id_for_label }}" class="w-40 text-sm text-gray-700">Пол</label>
      {{ form.gender }}
    </div>
    <div class="flex items-center gap-4 mb-3">
      <label for="{{ form.age.id_for_label }}" class="w-40 text-sm text-gray-700">Возраст</label>
      {{ form.age }}
    </div>
    <div class="flex items-center gap-4 mb-3">
      <label for="{{ form.height.id_for_label }}" class="w-40 text-sm text-gray-700">Рост, см</label>
      {{ form.height }}
    </div>
    <div class="flex items-center gap-4 mb-3">
      <label for="{{ form.weight.id_for_label }}" class="w-40 text-sm text-gray-700">Вес, кг</label>
      {{ form.weight }}
    </div>
    <div class="flex items-center gap-4 mb-3">
      <label for="{{ form.activity.id_for_label }}" class="w-40 text-sm text-gray-700">Активность</label>
      {{ form.activity }}
    </div>

    <div class="flex gap-3 mt-2">
      <button type="submit" class="inline-block bg-white text-primary border-2 border-primary px-5 py-2 rounded-lg hover:bg-primary-light font-medium">Сохранить</button>
      <a href="{% url 'profile' %}" class="text-gray-600 hover:underline self-center">Отмена</a>
    </div>
  </form>
{% endblock %}
