<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Фитнес трекер{% endblock %}</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="{% url 'index' %}">Главная</a>
        <a href="{% url 'workout_list' %}">Тренировки</a>
        <a href="{% url 'nutrition_list' %}">Питание</a>
        <a href="{% url 'measurement_list' %}">Замеры</a>
        {% if user.is_authenticated %}
          <span>{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button type="submit">Выйти</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Войти</a>
        {% endif %}
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      <small>Фитнес трекер</small>
    </footer>
  </body>
</html>
